[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aisc"
version = "0.1.0"
description = "AI Studying Consultant: profile Taiwanese applicants, surface US graduate programs they never considered, and optimise the application portfolio."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Po-An (Brian) Chan" }]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/aisc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
