<title>研究所學門探索</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<style>
/* Layout: one reading column; a four-step rail (consent → questions → familiarity → results)
   sits above it and tracks the real order of the flow. */
:root {
  --paper: #f3f6f6;
  --card: #ffffff;
  --ink: #15292d;
  --muted: #56696d;
  --line: #d3dfdf;
  --accent: #0d6b66;
  --accent-soft: #dcefec;
  --seal: #b5482f;
  --display: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --step: clamp(15px, 0.6vw + 13px, 17px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0f1a1c; --card: #16252a; --ink: #e2eceb; --muted: #9db1b2; --line: #2a3d41;
    --accent: #5cc3b8; --accent-soft: #173a39; --seal: #e3866d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0f1a1c; --card: #16252a; --ink: #e2eceb; --muted: #9db1b2; --line: #2a3d41;
  --accent: #5cc3b8; --accent-soft: #173a39; --seal: #e3866d; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink); font-family: var(--body); font-size: var(--step);
  line-height: 1.7;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 64px;
}
.wrap { max-width: 44rem; margin: 0 auto; display: grid; gap: 28px; }
h1, h2, h3 { font-family: var(--display); line-height: 1.35; text-wrap: balance; margin: 0; }
h1 { font-size: 1.9em; letter-spacing: 0.02em; }
h2 { font-size: 1.35em; }
h3 { font-size: 1.08em; }
p { margin: 0; }
.lede { color: var(--muted); max-width: 36em; }
.eyebrow { font-size: 0.78em; letter-spacing: 0.12em; color: var(--accent); font-weight: 700; }
.mono { font-family: var(--mono); font-size: 0.86em; letter-spacing: 0.02em; }
header.top { display: grid; gap: 10px; }

/* step rail */
ol.rail { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
ol.rail li { border-top: 3px solid var(--line); padding-top: 6px; font-size: 0.8em; color: var(--muted); }
ol.rail li.done { border-color: var(--accent); color: var(--ink); }
ol.rail li.now { border-color: var(--seal); color: var(--ink); font-weight: 700; }

section.panel { display: grid; gap: 18px; }
.box { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: grid; gap: 12px; }
ul.plain { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
button, .btn {
  font: inherit; font-weight: 700; border-radius: 999px; padding: 10px 22px; cursor: pointer;
  border: 1.5px solid var(--accent); background: var(--accent); color: var(--card);
}
button.ghost { background: transparent; color: var(--accent); }
button:disabled { opacity: 0.45; cursor: not-allowed; }
:focus-visible { outline: 3px solid var(--seal); outline-offset: 2px; }
label.consent { display: flex; gap: 10px; align-items: flex-start; }
label.consent input { margin-top: 0.45em; width: 1.1em; height: 1.1em; accent-color: var(--accent); }

/* questions */
.q { display: grid; gap: 10px; padding: 16px 0; border-bottom: 1px solid var(--line); }
.q:last-child { border-bottom: 0; }
.q .stem { font-weight: 500; }
.q .num { font-family: var(--mono); color: var(--muted); font-size: 0.8em; }
.q ul.ex { margin: 0; padding-left: 1.2em; color: var(--muted); font-size: 0.94em; }
fieldset.scale { border: 0; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
fieldset.scale legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt span {
  display: grid; place-items: center; text-align: center; min-height: 3.2em; padding: 6px 4px;
  border: 1.5px solid var(--line); border-radius: 8px; font-size: 0.82em; line-height: 1.35;
  background: var(--card); cursor: pointer;
}
.opt span b { font-family: var(--mono); font-size: 1.1em; color: var(--muted); font-weight: 500; }
.opt input:checked + span { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
.opt input:checked + span b { color: var(--accent); }
.opt input:focus-visible + span { outline: 3px solid var(--seal); outline-offset: 2px; }
.scale.anchored { grid-template-columns: 1fr; }
.scale.anchored .opt span { place-items: center start; text-align: left; min-height: 0; padding: 8px 12px; font-size: 0.9em; }
.stagehead { display: grid; gap: 6px; }
.sticky {
  position: sticky; bottom: 0; background: var(--paper); border-top: 1px solid var(--line);
  padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px));
}
.count { color: var(--muted); font-size: 0.88em; font-variant-numeric: tabular-nums; }

/* familiarity */
.fam { display: grid; gap: 8px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip input { position: absolute; opacity: 0; pointer-events: none; }
.chip span { display: inline-block; padding: 4px 14px; border-radius: 999px; border: 1.5px solid var(--line); font-size: 0.86em; cursor: pointer; }
.chip input:checked + span { border-color: var(--accent); background: var(--accent-soft); }
.chip input:focus-visible + span { outline: 3px solid var(--seal); outline-offset: 2px; }

/* results */
.profile { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: 12px; }
.bars { display: grid; gap: 6px; }
.bar { display: grid; grid-template-columns: 7.5em 1fr 2.6em; gap: 8px; align-items: center; font-size: 0.88em; }
.bar .track { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.bar .fill { height: 100%; background: var(--accent); }
.bar .v { font-family: var(--mono); color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.rec { display: grid; gap: 8px; padding: 16px 0; border-bottom: 1px solid var(--line); }
.rec .head { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: baseline; justify-content: space-between; }
.rec .name { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.reasons { display: flex; flex-wrap: wrap; gap: 6px; }
.reasons span { background: var(--accent-soft); border-radius: 4px; padding: 1px 8px; font-size: 0.82em; }
details summary { cursor: pointer; color: var(--accent); font-size: 0.88em; }
details p { font-size: 0.86em; color: var(--muted); margin-top: 6px; overflow-wrap: anywhere; }
.note { font-size: 0.86em; color: var(--muted); border-left: 3px solid var(--seal); padding-left: 12px; }
.sample { position: relative; }
.sample::after {
  content: "範例"; position: absolute; top: 12px; right: 12px; font-size: 0.72em; letter-spacing: 0.12em;
  color: var(--seal); border: 1px solid var(--seal); border-radius: 4px; padding: 0 6px;
}
.err { color: var(--seal); }
@media (prefers-reduced-motion: no-preference) {
  section.panel { animation: rise 0.25s ease-out; }
  @keyframes rise { from { transform: translateY(6px); } to { transform: none; } }
}
@media (max-width: 30rem) {
  fieldset.scale { grid-template-columns: 1fr; }
  .opt span { place-items: center start; text-align: left; min-height: 0; padding: 8px 12px; }
  .opt span b { display: none; }
  .bar { grid-template-columns: 6em 1fr 2.6em; }
}
</style>

<div class="wrap">
  <header class="top">
    <div class="eyebrow">美國研究所 · 碩士學門</div>
    <h1>研究所學門探索</h1>
    <p class="lede">回答你想做什麼，不用先知道學程名稱。工具會從美國 17,552 個碩士學程（863 種學門）中，找出契合但你可能沒想過的選項。</p>
    <ol class="rail" id="rail" aria-label="進度">
      <li>1 同意</li><li>2 回答問題</li><li>3 你聽過哪些</li><li>4 結果</li>
    </ol>
  </header>
  <main id="app" aria-live="polite"></main>
</div>

<script src="engine.js"></script>
<script>
(function () {
  "use strict";
  const app = document.getElementById("app");
  const rail = document.getElementById("rail");
  const state = { stage: "consent", answers: {}, page: null, familiarity: {}, result: null };
  const STAGE_TITLES = {
    core: ["第一段：興趣與學習偏好", "20 題。想像研究所的課程與活動，憑直覺回答。"],
    group: ["第二段：大領域", "12 題。每題列出一類領域的代表活動，回答整體有多想做。"],
    area: ["第三段：細分領域", "41 題，最有興趣的領域排在前面。"],
  };
  let data, eng;

  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  }
  function setRail(step) {
    [...rail.children].forEach((li, i) => {
      li.className = i < step ? "done" : i === step ? "now" : "";
    });
  }
  function top() { window.scrollTo({ top: 0 }); }

  function sampleReasons(p) {
    // reasons for a sample student who likes investigative work, statistics and IT
    const { vector } = eng.complete({ riasec_i: 1, bi_mathematics_statistics: 1, bi_information_technology: 1 }, {});
    return eng.reasons({ program: p, terms: eng.termsFor(vector, p.vector) }).map((x) => `<span>${esc(x.label)}</span>`).join("");
  }

  function renderConsent() {
    setRail(0);
    const ex = data.catalog.find((p) => p.name.startsWith("Data Science, General")) || data.catalog[0];
    app.innerHTML = `
      <section class="panel">
        <div class="box">
          <h2>開始之前</h2>
          <ul class="plain">
            <li>不需要姓名、身分證字號、電話或 e-mail。</li>
            <li>你的作答只在這個瀏覽器裡計算，不會上傳；關閉或重新整理頁面就會清除。</li>
            <li>每一題都可以不答；沒答的部分用一般預設值補上，結果會比較不精準。</li>
            <li>約 10–15 分鐘，共 73 題，分三段。</li>
          </ul>
          <label class="consent"><input type="checkbox" id="agree"><span>我了解上述說明，同意開始。</span></label>
          <div class="row"><button id="start" disabled>開始作答</button></div>
        </div>
        <div class="box sample" aria-label="結果範例">
          <div class="eyebrow">你會得到什麼</div>
          <div class="rec" style="border:0;padding:0">
            <div class="head"><span class="name">${esc(ex.name)}</span><span class="mono">CIP ${esc(ex.cip)}</span></div>
            <div class="count">${ex.schools.length} 所學校開設，例如 ${ex.schools.slice(0, 3).map((i) => esc(data.schools[i])).join("、")}</div>
            <div class="reasons">${sampleReasons(ex)}</div>
          </div>
          <p class="count">範例學生：喜歡研究型工作、數學統計與資訊科技。每個學門附上「為什麼適合你」與開設學校清單。</p>
        </div>
      </section>`;
    const agree = document.getElementById("agree");
    const start = document.getElementById("start");
    agree.addEventListener("change", () => { start.disabled = !agree.checked; });
    start.addEventListener("click", () => { state.stage = "core"; render(); top(); });
  }

  function pageItems(stage) {
    const items = data.items.filter((it) => it.stage === stage);
    if (stage !== "area") return items;
    const { groupScores } = eng.scoreAnswers(state.answers);
    const byDim = Object.fromEntries(items.map((it) => [it.dimension, it]));
    return eng.areaOrder(groupScores).map((k) => byDim[k]).filter(Boolean);
  }

  function renderQuestions(stage) {
    setRail(1);
    const items = pageItems(stage);
    const done = data.items.filter((it) => ["core", "group", "area"].indexOf(it.stage) < ["core", "group", "area"].indexOf(stage)).length;
    const [title, sub] = STAGE_TITLES[stage];
    const qs = items.map((it, i) => {
      const anchored = it.labels.some((l) => l.length > 8);
      const opts = it.labels.map((lab, v) => {
        const checked = state.answers[it.id] === v + 1 ? "checked" : "";
        return `<label class="opt"><input type="radio" name="${esc(it.id)}" id="${esc(it.id)}-${v + 1}" value="${v + 1}" ${checked}><span><b>${v + 1}</b>${esc(lab)}</span></label>`;
      }).join("");
      const ex = it.examples.length ? `<ul class="ex">${it.examples.map((e) => `<li>${esc(e)}</li>`).join("")}</ul>` : "";
      return `<div class="q"><div class="num">${done + i + 1} / ${data.items.length}</div><div class="stem">${esc(it.stem)}</div>${ex}
        <fieldset class="scale${anchored ? " anchored" : ""}"><legend>${esc(it.stem)}</legend>${opts}</fieldset></div>`;
    }).join("");
    const nextLabel = stage === "area" ? "看看哪些你聽過" : "下一段";
    app.innerHTML = `
      <section class="panel">
        <div class="stagehead"><h2>${esc(title)}</h2><p class="lede">${esc(sub)}</p></div>
        <div class="box" style="padding-block:4px">${qs}</div>
        <div class="sticky row"><button id="next">${nextLabel}</button>
          ${stage !== "core" ? '<button class="ghost" id="back">上一段</button>' : ""}
          <span class="count" id="left"></span></div>
      </section>`;
    const left = document.getElementById("left");
    function updateLeft() {
      const n = items.filter((it) => !state.answers[it.id]).length;
      left.textContent = n ? `這一段還有 ${n} 題沒答，可以直接繼續` : "這一段都答完了";
    }
    app.querySelectorAll('input[type="radio"]').forEach((r) =>
      r.addEventListener("change", () => { state.answers[r.name] = Number(r.value); updateLeft(); })
    );
    updateLeft();
    document.getElementById("next").addEventListener("click", () => {
      state.stage = stage === "core" ? "group" : stage === "group" ? "area" : "familiar";
      render(); top();
    });
    const back = document.getElementById("back");
    if (back) back.addEventListener("click", () => { state.stage = stage === "area" ? "group" : "core"; render(); top(); });
  }

  function profileVector() {
    const { needs, groupScores } = eng.scoreAnswers(state.answers);
    return { needs, groupScores, ...eng.complete(needs, groupScores) };
  }

  function renderFamiliar() {
    setRail(2);
    const prof = profileVector();
    if (!Object.keys(prof.needs).length) {
      app.innerHTML = `<section class="panel"><div class="box"><h2>還沒有任何作答</h2>
        <p>至少回答一部分題目，工具才能找出適合你的學門。</p>
        <div class="row"><button id="again">回到第一段</button></div></div></section>`;
      document.getElementById("again").addEventListener("click", () => { state.stage = "core"; render(); top(); });
      return;
    }
    const ids = eng.shortlist(prof.vector);
    const byId = Object.fromEntries(data.catalog.map((p) => [p.id, p]));
    ids.forEach((id) => { if (!(id in state.familiarity)) state.familiarity[id] = "unknown"; });
    const LV = [["unknown", "沒聽過"], ["heard", "聽過"], ["can_describe", "能說明在學什麼"]];
    const rows = ids.map((id) => {
      const p = byId[id];
      const chips = LV.map(([v, lab]) => `<label class="chip"><input type="radio" name="f-${esc(id)}" id="f-${esc(id)}-${v}" value="${v}" ${state.familiarity[id] === v ? "checked" : ""}><span>${lab}</span></label>`).join("");
      return `<div class="fam"><div><span class="name">${esc(p.name)}</span> <span class="mono count">CIP ${esc(p.cip)}</span></div><div class="chips" role="radiogroup" aria-label="${esc(p.name)}">${chips}</div></div>`;
    }).join("");
    app.innerHTML = `
      <section class="panel">
        <div class="stagehead"><h2>這些學門你聽過嗎？</h2>
          <p class="lede">這是和你最契合的 ${ids.length} 種學門。你沒聽過的會放進「你可能沒想過」，聽過的放在「你已經知道、而且適合」。</p></div>
        <div class="box" style="padding-block:4px">${rows}</div>
        <div class="sticky row"><button id="show">看結果</button><button class="ghost" id="back">修改作答</button></div>
      </section>`;
    app.querySelectorAll('.chip input').forEach((r) =>
      r.addEventListener("change", () => { state.familiarity[r.name.slice(2)] = r.value; })
    );
    document.getElementById("show").addEventListener("click", () => {
      const fam = Object.fromEntries(ids.map((id) => [id, state.familiarity[id]]));
      state.result = { prof, res: eng.discover(prof.vector, fam) };
      state.stage = "result"; render(); top();
    });
    document.getElementById("back").addEventListener("click", () => { state.stage = "core"; render(); top(); });
  }

  function bars(prof, keys) {
    return keys.map((k) => {
      const i = eng.keys.indexOf(k);
      const v = prof.vector[i];
      const lab = data.dims[i].label + (prof.source[k] === "prior" ? "＊" : "");
      return `<div class="bar"><span>${esc(lab)}</span><span class="track"><span class="fill" style="width:${Math.round(v * 100)}%;display:block"></span></span><span class="v">${v.toFixed(2)}</span></div>`;
    }).join("");
  }

  function recCard(r) {
    const p = r.program;
    const names = p.schools.map((i) => data.schools[i]);
    const reasons = eng.reasons(r).map((x) => `<span>${esc(x.label)}</span>`).join("");
    return `<div class="rec"><div class="head"><span class="name">${esc(p.name)}</span><span class="mono count">CIP ${esc(p.cip)}</span></div>
      ${reasons ? `<div class="reasons" aria-label="為什麼適合">${reasons}</div>` : ""}
      <details><summary>${names.length} 所學校開設</summary><p>${names.map(esc).join("、")}</p></details></div>`;
  }

  function resultText() {
    const { res } = state.result;
    const line = (r) => `- ${r.program.name}（CIP ${r.program.cip}，${r.program.schools.length} 所學校）：${eng.reasons(r).map((x) => x.label).join("、")}`;
    return ["你可能沒想過：", ...res.discoveries.map(line), "", "你已經知道、而且適合：", ...(res.knownGood.length ? res.knownGood.map(line) : ["（無）"])].join("\n");
  }

  function renderResult() {
    setRail(3);
    const { prof, res } = state.result;
    const interest = data.dims.filter((d) => d.layer === "interest").map((d) => d.key);
    const areas = data.dims.filter((d) => d.layer === "domain").map((d) => d.key)
      .sort((a, b) => prof.vector[eng.keys.indexOf(b)] - prof.vector[eng.keys.indexOf(a)]).slice(0, 6);
    const answered = Object.values(state.answers).filter(Boolean).length;
    app.innerHTML = `
      <section class="panel">
        <div class="stagehead"><h2>你的結果</h2><p class="count">作答 ${answered} / ${data.items.length} 題</p></div>
        <div class="box">
          <h3>你可能沒想過</h3>
          <p class="count">契合你的需求，而且你說沒聽過的學門，依契合度排序。</p>
          <div>${res.discoveries.map(recCard).join("") || "<p>沒有找到。</p>"}</div>
        </div>
        <div class="box">
          <h3>你已經知道、而且適合</h3>
          <div>${res.knownGood.map(recCard).join("") || '<p class="count">你剛才沒有勾選聽過的學門。</p>'}</div>
        </div>
        <div class="box">
          <h3>你的需求剖面</h3>
          <div class="profile">
            <div class="bars"><div class="eyebrow">興趣類型</div>${bars(prof, interest)}</div>
            <div class="bars"><div class="eyebrow">最有興趣的領域</div>${bars(prof, areas)}</div>
          </div>
          <p class="count">＊沒有作答，用預設值補上。</p>
        </div>
        <p class="note">結果只是探索的起點。學門資料來自 IPEDS 2025 碩士畢業紀錄與 O*NET 職業興趣（取得於 ${esc(data.catalog_source.retrieved_at)}）；各校課程的數理、程式、研究與創業取向還沒有測量，同一學門的學校目前分數相同。申請前請到各校官網確認課程內容與條件。</p>
        <div class="row"><button id="copy">複製結果</button><button class="ghost" id="restart">重新開始</button><span class="count" id="copied"></span></div>
        <textarea id="copybox" readonly hidden style="width:100%;min-height:10em;font:inherit"></textarea>
      </section>`;
    document.getElementById("copy").addEventListener("click", () => {
      const text = resultText();
      const done = () => { document.getElementById("copied").textContent = "已複製"; };
      const fallback = () => {
        const box = document.getElementById("copybox");
        box.value = text; box.hidden = false; box.select();
        document.getElementById("copied").textContent = "請手動複製下方文字";
      };
      try { navigator.clipboard.writeText(text).then(done, fallback); } catch (e) { fallback(); }
    });
    document.getElementById("restart").addEventListener("click", () => {
      state.answers = {}; state.familiarity = {}; state.result = null; state.stage = "consent"; render(); top();
    });
  }

  function render() {
    if (state.stage === "consent") renderConsent();
    else if (["core", "group", "area"].includes(state.stage)) renderQuestions(state.stage);
    else if (state.stage === "familiar") renderFamiliar();
    else renderResult();
  }

  function boot(d) {
    data = d;
    eng = AiscEngine.makeEngine(data);
    render();
  }
  if (window.AISC_DATA) boot(window.AISC_DATA);
  else fetch("data.json").then((r) => r.json()).then(boot).catch(() => {
    app.innerHTML = '<p class="err">讀不到學門資料（data.json）。請用網頁伺服器開啟這個資料夾，例如在 web/ 執行 python -m http.server。</p>';
  });
})();
</script>
